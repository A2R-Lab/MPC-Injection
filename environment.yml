name: mpc-rl
channels:
  - conda-forge
dependencies:
  - python=3.11.13
  - pip=25.2
  - git=2.51.0
  - pip:
      # dev indexes first so mujoco/mjx/warp dev wheels resolve
      # - --extra-index-url https://py.mujoco.org
      # - --extra-index-url https://pypi.nvidia.com/warp-lang/

      # install from Git HEAD (pin to a commit for reproducibility)
      # - "playground @ git+https://github.com/google-deepmind/mujoco_playground@main"

      # choose exactly one of these two JAX lines:
      # - jax           # CPU only
      - jax[cuda12]==0.6.2
      - jaxlib==0.6.2

      # RSL-RL & Brax stack
      # - rsl-rl-lib>=3.0.0
      # - brax>=0.12.5
      # - flax
      # - etils
      # - ml_collections
      # - orbax-checkpoint>=0.11.22
      - tqdm==4.67.1
      - wandb==0.22.1
      - tensorboard==2.20.0

      # SB3/SBX RL stack
      - sbx-rl==0.23.0
      - stable-baselines3==2.7.0
      - gymnasium[classical_control]==1.2.1
      - gymnasium-robotics==1.4.1
      - shimmy[dm-control]==2.0.0
      - opencv-python==4.12.0.88

      # MuJoCo stack
      - mujoco==3.3.6
      - mujoco-mjx==3.3.6

      # Warp dev wheels
      - warp-lang==1.10.1

      # utils
      - lxml==6.0.2
      - mediapy==1.2.4
      - matplotlib==3.10.6
      - jupyter==1.1.1
      - umap-learn==0.5.9.post2
      - viser==1.0.21
      - robot_descriptions==1.22.0
      - tyro==1.0.5

      # Existing policy exporter uses the PyTorch 2.8 ONNX export path.
      - torch==2.8.0
      - onnx==1.20.1
      - onnxruntime==1.24.3
      # Match MJPC protobuf generation and runtime (working baseline).
      - grpcio==1.76.0
      - grpcio-tools==1.76.0
      - protobuf==6.32.1
